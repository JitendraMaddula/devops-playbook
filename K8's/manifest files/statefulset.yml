# Headless Service: gives each Pod a stable DNS name (my-nginx-sts-0.my-nginx-headless, ...)
apiVersion: v1
kind: Service
metadata:
  name: my-nginx-headless
  labels:
    tier: frontend
spec:
  clusterIP: None
  selector:
    app: my-nginx
  ports:
  - port: 80
    name: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-nginx-sts
  labels:
    tier: frontend
spec:
  serviceName: my-nginx-headless # MUST match the headless Service name above
  replicas: 3
  selector:
    matchLabels:
      app: my-nginx

  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: my-nginx   # MUST match the selector.matchLabels above
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.24
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"

  # One PersistentVolumeClaim per Pod (data-my-nginx-sts-0, -1, -2)
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
