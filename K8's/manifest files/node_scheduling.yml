apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-gpu-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-worker
  template:
    metadata:
      labels:
        app: gpu-worker
    spec:
      # 1. NODE SELECTOR (Attraction)
      # Forces the Pod to only run on Nodes with the label 'hardware: gpu'
      nodeSelector:
        hardware: gpu
        
      # 2. TOLERATIONS (VIP Pass for Tainted Nodes)
      # Allows this Pod to run on a Node that has a "NoSchedule" taint
      tolerations:
      - key: "special-hardware"
        operator: "Equal"
        value: "nvidia-t4"
        effect: "NoSchedule"
        
      containers:
      - name: worker
        image: gpu-worker:latest
