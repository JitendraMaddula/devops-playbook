apiVersion: v1
kind: Pod
metadata:
  name: my-nginx-pod
  labels:
    app: frontend
    env: dev
spec:
  containers:
  - name: nginx-container
    image: nginx:1.24
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"