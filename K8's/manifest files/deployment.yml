apiVersion: apps/v1
kind: Deployment
metadata: 
  name: app-deployment
  labels:
    tire: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: app-container
          image: maddulajitendra/app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi