apiVersion: v1
kind: ReplicationController
metadata:
  name: my-nginx-rc
  labels:
    tier: frontend
spec:
  replicas: 3
  # Equality-based selector only: a plain key/value map (no matchLabels)
  selector:
    app: my-nginx

  template:
    metadata:
      labels:
        app: my-nginx   # MUST match the selector above
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.24
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
